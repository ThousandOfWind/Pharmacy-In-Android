appId: com.thousandofwind.pharmacy
---
- launchApp:
    clearState: true
- assertVisible: '我的药箱'
- tapOn: '添加第一件药品'
- tapOn: '手动添加'
- tapOn: '保存到药箱'
- assertVisible: '请填写药品名称'
- tapOn: '药品名称（必填）'
- inputText: 'E2E-阿莫西林'
- runFlow: 'dismiss-keyboard.yaml'
- tapOn: '当前余量（可选）'
- inputText: '10'
- runFlow: 'dismiss-keyboard.yaml'
- tapOn: '保存到药箱'
- assertVisible: '请选择余量单位'
- tapOn: '选择单位'
- tapOn: '片'
- tapOn: '保存到药箱'
- assertVisible: '我的药箱'
- assertVisible: 'E2E-阿莫西林'
- assertVisible: '剩余 10 片'
- tapOn: '搜索药品名称、包装功效或备注'
- inputText: '不存在的E2E药品'
- runFlow: 'dismiss-keyboard.yaml'
- assertVisible: '没有符合条件的药品'
- assertNotVisible: 'E2E-阿莫西林'
- tapOn: '清除'
- assertVisible: 'E2E-阿莫西林'
- tapOn: 'E2E-阿莫西林'
- assertVisible: '药品详情'
- assertVisible: '剩余 10 片'
- tapOn: '更新余量'
- tapOn: '当前余量（可选）'
- eraseText
- inputText: '8'
- runFlow: 'dismiss-keyboard.yaml'
- tapOn: '确认更新'
- assertVisible: '剩余 8 片'
- stopApp
- launchApp
- assertVisible: '我的药箱'
- assertVisible: 'E2E-阿莫西林'
- assertVisible: '剩余 8 片'
- takeScreenshot: 'smoke'
