name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

# Serialize main publications so an older build cannot race a newer release.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare fixed debug signing key (main only)
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.PHARMACY_DEBUG_KEYSTORE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Missing PHARMACY_DEBUG_KEYSTORE: refusing to publish with a temporary signing key.' >&2
            exit 1
          fi
          umask 077
          path="$RUNNER_TEMP/pharmacy-debug.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Test, lint and build debug APK
        env:
          PHARMACY_SIGNING_STORE: ${{ steps.signing.outputs.path }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug \
            -PpharmacyVersionCode=$((GITHUB_RUN_NUMBER + 1)) \
            -PpharmacyVersionName="1.0.$GITHUB_RUN_NUMBER"

      - name: Create update metadata
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          run = int(os.environ['RUN_NUMBER'])
          metadata = dict(versionCode=run + 1, versionName=f'1.0.{run}',
                          sha256=hashlib.sha256(apk.read_bytes()).hexdigest(), size=apk.stat().st_size)
          apk.with_name('update.json').write_text(json.dumps(metadata), encoding='utf-8')
          PY

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pharmacy-debug.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/update.json
          if-no-files-found: error

  publish-update:
    needs: build-apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated main APK
        uses: actions/download-artifact@v4
        with:
          name: pharmacy-debug-apk
          path: release

      - name: Publish public debug update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.0.${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A rerun must not replace an already published version's assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its APK unchanged."
            exit 0
          fi
          latest_flag=--latest
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [[ "$latest" =~ ^v1\.0\.([0-9]+)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
            latest_flag=--latest=false
          fi
          gh release create "$TAG" release/app-debug.apk release/update.json \
            --target "$COMMIT" --title "Pharmacy ${TAG#v} (debug)" \
            --notes "来自 main 提交 $COMMIT 的调试 APK。应用内可检查、校验并请求系统安装。首次使用新签名时，旧 APK 可能无法覆盖安装；请保留药箱数据，不要直接卸载。" \
            "$latest_flag"
