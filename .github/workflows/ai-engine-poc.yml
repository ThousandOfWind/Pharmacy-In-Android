name: AI engine PoC

on:
  pull_request:
    paths:
      - 'experiments/ai-engine-poc/**'
      - '.github/workflows/ai-engine-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/ai-engine-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify both SDKs against synthetic fixtures and build isolated APKs
        run: |
          ./gradlew --no-daemon :koog-app:testDebugUnitTest :openai-app:testDebugUnitTest \
            :baseline-app:assembleDebug :koog-app:assembleDebug :openai-app:assembleDebug \
            :koog-app:lintDebug :openai-app:lintDebug
          mkdir -p build
          python3 measure.py > build/measurement.json
      - name: Upload PoC artifacts (not pharmacy updates)
        uses: actions/upload-artifact@v4
        with:
          name: ai-engine-poc
          path: |
            experiments/ai-engine-poc/*-app/build/outputs/apk/debug/*.apk
            experiments/ai-engine-poc/build/measurement.json
            experiments/ai-engine-poc/*-app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: error
